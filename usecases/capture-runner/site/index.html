<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Field notes — a gallery page</title>
  <style>
    body { margin: 0; font: 16px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #24292f; background: #f6f8fa; }
    header { background: #24292f; color: #fff; padding: 18px 40px; display: flex; align-items: center; gap: 14px; }
    header img { width: 36px; height: 36px; }
    header nav a { color: #c9d1d9; margin-left: 22px; text-decoration: none; }
    .hero { height: 220px; background: url("/bot/assets/description.jpg") center/cover; position: relative; }
    .hero h1 { position: absolute; left: 40px; bottom: 18px; margin: 0; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    main { max-width: 1100px; margin: 28px auto; padding: 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    figure { margin: 0; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; }
    figure img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: #eef1f5; border-radius: 6px; }
    figcaption { font-size: 13px; color: #57606a; margin-top: 8px; }
    p.lead { max-width: 720px; color: #57606a; }
  </style>
</head>
<body>
  <header>
    <img src="/browser/favicon.svg" alt="logo"><strong>Field notes</strong>
    <nav><a href="#">Gallery</a><a href="#">Sketches</a><a href="#">About</a></nav>
  </header>
  <div class="hero"><h1>This week's plates</h1></div>
  <main>
    <p class="lead">Every picture on this page is one the Stencil extension can list, filter, crop and hand to
      the editor — including the header logo and the CSS hero background.</p>
    <div class="grid">
      <figure><img src="/bot/assets/icon.png" alt="Plate 1"><figcaption>Plate 1 · icon, 512×512</figcaption></figure>
      <figure><img src="/bot/assets/description.jpg" alt="Plate 2"><figcaption>Plate 2 · banner, 640×360</figcaption></figure>
      <figure><img src="/vscode-extension/icon.png" alt="Plate 3"><figcaption>Plate 3 · editor icon</figcaption></figure>
      <figure><img src="/browser-extension/icons/icon-128.png" alt="Plate 4"><figcaption>Plate 4 · extension icon</figcaption></figure>
      <figure><img src="/browser/icon-maskable.svg" alt="Plate 5"><figcaption>Plate 5 · maskable mark</figcaption></figure>
      <figure><img src="/desktop/packaging/icon/appicon-foreground.svg" alt="Plate 6"><figcaption>Plate 6 · desktop mark</figcaption></figure>
      <figure><img src="/vscode-extension/icons/stc.svg" alt="Plate 7"><figcaption>Plate 7 · script file icon</figcaption></figure>
      <figure><img src="/vscode-extension/icons/stencil-light.svg" alt="Plate 8"><figcaption>Plate 8 · project file icon</figcaption></figure>
    </div>
  </main>
</body>
</html>
