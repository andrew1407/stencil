# The SAME Content-Security-Policy index.html carries in its <meta>, as a real
# response header. Held in a map because nginx does NOT inherit add_header into a
# location that sets one of its own — /sw.js below has to re-add it.
map $host $stencil_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' data: blob: https: http: wss: ws:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default mime.types lacks .webmanifest; the wasm is embedded in the .js
    # module (SINGLE_FILE), so no .wasm type is needed.
    types {
        include /etc/nginx/mime.types;
        application/manifest+json  webmanifest;
    }

    add_header Content-Security-Policy $stencil_csp always;

    # The service worker must always be revalidated so updates roll out.
    location = /sw.js {
        add_header Content-Security-Policy $stencil_csp always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
