# The SAME Content-Security-Policy index.html carries in its <meta>, as a real
# response header. Held in a map because nginx does NOT inherit add_header into a
# location that sets one of its own — every location below that sets a header re-adds it.
map $host $stencil_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' data: blob: https: http: wss: ws:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
}

# The app is hundreds of small ES modules, so it is meant to sit behind a TLS terminator that speaks
# HTTP/2 (a browser speaks h2 only over TLS); served straight off :80 every module waits its turn on
# HTTP/1.1's six connections. To terminate TLS here instead, mount a certificate and swap the listen:
#   listen 443 ssl;  http2 on;  ssl_certificate /etc/nginx/certs/fullchain.pem;
#   ssl_certificate_key /etc/nginx/certs/privkey.pem;
server {
    listen 80;
    server_name _;

    # The image holds the app (browser/) at the root and its shared tables and art at /common/.
    root /usr/share/nginx/html;
    index index.html;

    # mime.types holds a `types {}` block of its own, so it is included beside ours, never inside it;
    # it lacks .webmanifest.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json  webmanifest;
        application/wasm           wasm;
    }

    # bytes: below this a gzip header costs more than it saves. Level 5: most of 9's ratio at a
    # fraction of its CPU. text/html is always on the list.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/wasm;

    add_header Content-Security-Policy $stencil_csp always;

    # The entry points and the service worker revalidate on every load (an ETag answers 304), so a
    # deploy rolls out at once.
    location = /sw.js {
        add_header Content-Security-Policy $stencil_csp always;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(index\.html|launch\.html|manifest\.webmanifest)?$ {
        add_header Content-Security-Policy $stencil_csp always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Modules, styles, tables and art keep their paths across deploys, so they revalidate too: a page
    # the stamped worker does not serve never pairs a new index.html with a previous deploy's modules.
    location ~* \.(js|css|json|wasm|svg)$ {
        add_header Content-Security-Policy $stencil_csp always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
