<!doctype html>
<!-- The published site's root: the app lives at browser/ beside common/, so an old link to the root (a
     #stencil= hand-off, a bookmark) is forwarded there with its query and fragment, and the service
     worker the root once registered is dropped so it cannot shadow the app's own. -->
<meta charset="utf-8">
<title>Stencil</title>
<script>
  const go = () => location.replace('browser/' + location.search + location.hash);
  const here = new URL('./', location.href).href;
  const drop = navigator.serviceWorker?.getRegistrations()
    .then((all) => Promise.all(all.filter((r) => r.scope === here).map((r) => r.unregister())));
  Promise.race([drop, new Promise((done) => setTimeout(done, 400))]).finally(go);
</script>
<noscript><meta http-equiv="refresh" content="0; url=browser/"></noscript>
<a href="browser/">Open Stencil</a>
