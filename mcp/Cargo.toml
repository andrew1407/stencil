[package]
name = "stencil-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol server exposing Stencil's image/video editing pipeline (wraps the Zig CLI)"
license = "MIT"

[[bin]]
name = "stencil-mcp"
path = "src/main.rs"

[dependencies]
# Exact pins, not caret ranges: Cargo.lock pins the transitive tree, this pins the direct
# one. Resolve a bump with `cargo tree --depth 0` and write THAT version.
# Official Rust MCP SDK. `server` brings ServerHandler/ToolRouter, `transport-io`
# brings the stdio transport, `macros` brings the #[tool_router]/#[tool] attributes.
rmcp = { version = "=1.8.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "process", "io-std", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
schemars = "=1.2.1"
tempfile = "=3.27.0"
base64 = "=0.22.1"

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
serde_json = "=1.0.150"

# Corpus walkers: their own per-case harness (tests/common/walk.rs) so every fixture
# reports under its own name instead of one opaque walk.
[[test]]
name = "sanitizer_fixtures_test"
harness = false

[[test]]
name = "fixtures_test"
harness = false

[[test]]
name = "opplan_fixtures_test"
harness = false

[[test]]
name = "llm_wire_fixtures_test"
harness = false

[[test]]
name = "layout_fixtures_test"
harness = false
