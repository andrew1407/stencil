name: Desktop packages

# Builds self-contained desktop packages for macOS / Windows / Linux; on a version
# tag it also attaches them to the GitHub release, otherwise it just uploads them as
# workflow artifacts so packaging is exercised on every push that touches the app.
on:
  push:
    branches: [main]
    tags: ['v*']
    # A package is the desktop app over the core, with the shared JSON + artwork its
    # qrc embeds — nothing else changes a byte of it, so other pushes skip the three
    # runners. (GitHub does not apply path filters to tag pushes: a release always builds.)
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'browser/js/config/**'
      - 'browser/favicon.svg'
      - '.github/workflows/desktop-packages.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'browser/js/config/**'
      - 'browser/favicon.svg'
      - '.github/workflows/desktop-packages.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: write  # attach assets to the release on a tag push

# Opt bundled JS actions into node24 ahead of the runner's forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # One directory for whichever cache tool the OS uses, so a single cache step covers all
      # three. Both tools read their own variable and ignore the other's.
      CCACHE_DIR: ${{ github.workspace }}/.compilercache
      CCACHE_MAXSIZE: 500M
      SCCACHE_DIR: ${{ github.workspace }}/.compilercache
      SCCACHE_CACHE_SIZE: 500M
    strategy:
      fail-fast: false
      matrix:
        # `parallel` is the runner's core count — 3 on the small macOS box, 4 elsewhere.
        # Windows needs Ninja: the Visual Studio generator ignores CMake's compiler
        # launchers, so it is the one generator that cannot be cached. MSVC is also why it
        # uses sccache rather than ccache.
        include:
          - { os: macos-latest,   name: macOS,   ext: dmg,    parallel: 3,
              cachetool: ccache,  generator: '' }
          - { os: windows-latest, name: Windows, ext: zip,    parallel: 4,
              cachetool: sccache, generator: '-G Ninja' }
          - { os: ubuntu-latest,  name: Linux,   ext: tar.gz, parallel: 4,
              cachetool: ccache,  generator: '-G Ninja' }
    steps:
      - uses: actions/checkout@v5

      # 6.9 is the floor: macos-latest (macOS 26 / Tahoe) dropped AGL from the SDK and
      # Qt <= 6.9.1 still links -framework AGL in Qt6::Gui (QTBUG-137687).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          modules: qtimageformats qtmultimedia  # qtmultimedia backs the --src video-frame grab
          cache: true

      # The app is ~320 translation units (262 desktop + the core) and Qt is the only
      # thing cached between runs, so every push recompiled all of it. The cache is
      # restored by prefix — a new commit starts from the previous build's objects and
      # only recompiles what changed.
      - name: Install ccache (+ Ninja on Linux)
        if: matrix.cachetool == 'ccache'
        run: ${{ runner.os == 'macOS' && 'brew install ccache' || 'sudo apt-get update && sudo apt-get install -y ccache ninja-build' }}

      # MSVC cannot be cached through the Visual Studio generator, so Windows builds with
      # Ninja inside a developer environment — the same shape ci.yml's Linux builds use.
      - name: Install sccache + Ninja (Windows)
        if: matrix.cachetool == 'sccache'
        run: choco install sccache ninja -y --no-progress

      - name: MSVC developer environment (Windows)
        if: matrix.cachetool == 'sccache'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.compilercache
          key: ccache-desktop-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-desktop-${{ matrix.os }}-

      - name: Reset the cache counters
        run: ${{ matrix.cachetool }} --zero-stats

      # STENCIL_REQUIRE_QT fails loudly if Qt is missing (rather than skipping the GUI +
      # CPack config and erroring later in cpack); CMAKE_PREFIX_PATH points at the Qt above.
      - name: Configure (portable build — no repo-local state dir)
        working-directory: desktop
        run: cmake -S . -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release -DSTENCIL_DEV_STATE_DIR=OFF -DSTENCIL_REQUIRE_QT=ON -DSTENCIL_BUILD_TESTS=OFF -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.cachetool }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.cachetool }} -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      # Build only the shipped app, not the 66 Qt test binaries (ci.yml builds + runs those).
      # STENCIL_BUILD_TESTS=OFF above is what keeps them out: cpack runs the `preinstall`
      # target, which builds `all`, so merely limiting THIS step to --target stencil does not.
      # --parallel is the runner's core count; the macOS box has fewer than the others.
      - name: Build
        working-directory: desktop
        run: cmake --build build --config Release --target stencil --parallel ${{ matrix.parallel }}

      # Prints the hit rate, so a cache that silently stops working is visible in the log
      # rather than just showing up as a slow job.
      - name: Compiler cache hit rate
        run: ${{ matrix.cachetool }} --show-stats

      - name: Package (deploy Qt + cpack)
        working-directory: desktop
        run: cpack --config build/CPackConfig.cmake -B build/dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: stencil-${{ matrix.name }}
          path: desktop/build/dist/stencil-*.${{ matrix.ext }}
          if-no-files-found: error

      - name: Attach to release  # tag push only; creates the release if missing
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" desktop/build/dist/stencil-*.${{ matrix.ext }} --clobber
