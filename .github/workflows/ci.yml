name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # a manual run exercises every job

# Opt bundled JS actions into node24 ahead of the runner's forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Which jobs a change can reach. Each job below runs only when something it builds
  # or reads changed — its own tree plus the cross-tree inputs it compiles, embeds or
  # asserts parity against (core/ for everything that recompiles it, browser/js/config/
  # for the surfaces that embed the shared JSON, and so on; the patterns are the
  # inventory). Markdown never feeds a build or a test, so docs-only pushes run
  # nothing. A manual run, a new branch, a force-push whose old tip is gone, or an
  # edit to this file runs the lot.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      single_file: ${{ steps.filter.outputs.single_file }}
      extension: ${{ steps.filter.outputs.extension }}
      core: ${{ steps.filter.outputs.core }}
      desktop: ${{ steps.filter.outputs.desktop }}
      wasm: ${{ steps.filter.outputs.wasm }}
      cli: ${{ steps.filter.outputs.cli }}
      pystencil: ${{ steps.filter.outputs.pystencil }}
      mcp: ${{ steps.filter.outputs.mcp }}
      server: ${{ steps.filter.outputs.server }}
      e2e: ${{ steps.filter.outputs.e2e }}
      bot: ${{ steps.filter.outputs.bot }}
      guard: ${{ steps.filter.outputs.guard }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the diff needs the push's old tip / the PR's base
      - id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=false
          files=""
          case "$GITHUB_EVENT_NAME" in
            # A PR checkout is the merge commit, so its first parent is the base branch.
            pull_request) files=$(git diff --name-only HEAD^1 HEAD) ;;
            push)
              if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                files=$(git diff --name-only "$BEFORE" HEAD)
              else
                all=true
              fi ;;
            *) all=true ;;
          esac
          files=$(printf '%s\n' "$files" | grep -Ev '\.md$' || true)
          printf '%s\n' "$files" | grep -Eq '^\.github/workflows/ci\.yml$' && all=true
          echo "== changed (docs dropped) =="; printf '%s\n' "$files"; echo "all=$all"

          hit() { $all || printf '%s\n' "$files" | grep -Eq "$1"; }
          flag() { local v=false; hit "$2" && v=true; echo "$1=$v" >> "$GITHUB_OUTPUT"; echo "$1: $v"; }
          cfg='^browser/js/config/'
          # Tests pin parity against sibling trees (browser ↔ desktop/src + extension/src,
          # extension ↔ browser/js + css), so those count as inputs too.
          flag browser     '^browser/|^extension/src/|^desktop/src/'
          flag single_file '^browser/'
          flag extension   '^extension/|^browser/(js|css)/'
          flag core        '^core/'
          flag desktop     "^desktop/|^core/|^browser/js/|^browser/favicon\.svg$"
          flag wasm        '^core/|^browser/'
          flag cli         "^cli/|^core/|$cfg"
          flag pystencil   "^pystencil/|^core/|$cfg"
          flag mcp         "^mcp/|^cli/|^core/|$cfg"
          flag server      "^server/|$cfg"
          flag bot         "^bot/|$cfg"
          flag e2e         '^e2e/|^browser/|^extension/|^server/|^cli/|^core/|^docker-compose\.yml$'
          flag guard       '^\.claude/hooks/'

          # The image matrix: only the images whose build context changed. Each entry is
          # image,dockerfile,context; browser/cli/mcp/bot build from the repo root.
          images=()
          hit "^browser/|^core/|^\.dockerignore$"        && images+=("stencil-browser,browser/Dockerfile,.")
          hit "^cli/|^core/|$cfg|^\.dockerignore$"       && images+=("stencil-cli,cli/Dockerfile,.")
          hit "^mcp/|^cli/|^core/|$cfg|^\.dockerignore$" && images+=("stencil-mcp,mcp/Dockerfile,.")
          hit "^bot/|^cli/|^core/|$cfg|^\.dockerignore$" && images+=("stencil-bot,bot/Dockerfile,.")
          hit '^server/'                                  && images+=("stencil-server,server/Dockerfile,server")
          json=$(jq -cn '[$ARGS.positional[] | split(",") | {image: .[0], dockerfile: .[1], context: .[2]}]' --args ${images[@]+"${images[@]}"})
          echo "images=$json" >> "$GITHUB_OUTPUT"; echo "images: $json"

  # Browser: vanilla ES-module JS, no build step. wasm-parity self-skips here (no wasm
  # artifact) — the wasm job asserts it against a fresh build.
  browser:
    name: Browser (JS tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run JS tests
        working-directory: browser
        run: npm test

  # Single-file build: the browser app's ONE optional build step (vite, a local dev dep) —
  # packs the whole app into a self-contained stencil.html. The rewrite patterns it depends
  # on are guarded without a build by tests/singleFileBuild.test.js (browser job); this runs
  # the real thing, and tools/assertSelfContained.js then asserts the output needs no
  # sibling file and that its inline module still parses.
  single-file:
    name: Browser (single-file build)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.single_file == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      # browser/package-lock.json is tracked, so install exactly what it pins.
      - name: Install vite (the only dev dependency)
        working-directory: browser
        run: npm ci
      - name: Build + verify stencil.html
        working-directory: browser
        run: npm run build

  # Extension: vanilla MV3, no build step; node:test over the chrome/DOM-free modules.
  extension:
    name: Extension (JS tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run JS tests
        working-directory: extension
        run: npm test

  # Core: the shared GUI-free C++ library + its Doctest suite (desktop reuses the lib, tests OFF).
  core:
    name: Core (C++ build + tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (g++, cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build
      - name: Configure
        run: cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (library + tests)
        run: cmake --build core/build -j
      - name: Run C++ tests
        run: ctest --test-dir core/build --output-on-failure

  # Desktop: Qt6 GUI over the shared core (doctest OFF here); ctest runs the Qt headless tests.
  desktop:
    name: Desktop (C++ build + tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (g++, cmake, Qt6)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build qt6-base-dev qt6-multimedia-dev
      - name: Configure
        working-directory: desktop
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (core + GUI)
        working-directory: desktop
        run: cmake --build build -j
      - name: Run C++ tests
        working-directory: desktop
        run: ctest --test-dir build --output-on-failure

  # WebAssembly: build the core fresh with emcc and run the parity test against it —
  # fails if core/JS-fallback behavior diverges. emsdk is pinned + cached.
  wasm:
    name: WebAssembly (build + parity)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    env:
      EMSDK_VERSION: '5.0.7'
    steps:
      - uses: actions/checkout@v5
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten (if not cached)
        run: |
          if [ ! -d emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
      - name: Build the wasm core
        run: |
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          emcmake cmake -S core -B core/build-wasm -DCMAKE_BUILD_TYPE=Release
          emmake cmake --build core/build-wasm -j --target stencil_wasm
      - name: Place the freshly built module in the browser tree
        # js/wasm/ holds only the gitignored artifact, so it's absent on checkout.
        run: |
          mkdir -p browser/js/wasm
          cp core/build-wasm/stencil_core.js browser/js/wasm/stencilCore.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Parity test against the freshly built module
        working-directory: browser
        run: node --test tests/wasm-parity.test.js

  # CLI: Zig tool that recompiles the core + stb_image (Zig ships its own clang, no system toolchain).
  cli:
    name: CLI (Zig build + tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        working-directory: cli
        run: zig build
      - name: Test
        working-directory: cli
        run: zig build test --summary all

  # pystencil: stdlib-only Python package that recompiles the core over ctypes (like the CLI).
  # Tests build the shared lib on demand via build.py, which only needs a C++17 compiler (`c++`).
  pystencil:
    name: pystencil (Python tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pystencil == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (g++)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
      - name: Run Python tests
        working-directory: pystencil
        run: python3 -m unittest discover -s tests

  # MCP: Rust server shelling out to the CLI; build the CLI first + set STENCIL_CLI for the gated e2e tests.
  mcp:
    name: MCP (Rust build + tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build the Stencil CLI (for the end-to-end tests)
        working-directory: cli
        run: zig build
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: mcp
        run: cargo build --locked --verbose
      - name: Test
        working-directory: mcp
        run: cargo test --locked --verbose
        env:
          STENCIL_CLI: ${{ github.workspace }}/cli/zig-out/bin/stencil

  # Server: Go collaboration server (does NOT compile core/). Postgres + Redis run as service
  # containers; the gated store/bus tests pick them up via TEST_DATABASE_URL/REDIS_URL. Hub tests run -race.
  server:
    name: Server (Go build + tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stencil
          POSTGRES_PASSWORD: stencil
          POSTGRES_DB: stencil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stencil"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # No go.sum is tracked, so there is nothing to key the module cache on.
          cache: false
      # go.sum is tracked; verify it matches go.mod, then vendor from it (vendor/ is what
      # every build/vet/test step uses via -mod=vendor).
      - name: Vendor dependencies
        working-directory: server
        run: |
          go mod verify
          go mod vendor
      - name: Build
        working-directory: server
        run: go build -mod=vendor ./...
      - name: Vet
        working-directory: server
        run: go vet -mod=vendor ./...
      - name: Test (with race detector)
        working-directory: server
        run: go test -race -mod=vendor ./...
        env:
          TEST_DATABASE_URL: postgres://stencil:stencil@localhost:5432/stencil?sslmode=disable
          REDIS_URL: redis://localhost:6379/0

  # E2E: Playwright smoke tests across every surface (does NOT compile core/). Drives the
  # browser app + MV3 extension in real Chromium (hence xvfb) and black-boxes the server
  # binary over REST/WS/TCP; the db+redis+server stack comes up via docker-compose.
  e2e:
    name: E2E (Playwright + compose)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The CLI e2e project drives the real Zig binary (the contract mcp/ + bot/ share),
      # so build it here; the project self-skips if the binary is absent.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build the Stencil CLI
        working-directory: cli
        run: zig build
      - name: Install harness deps
        working-directory: e2e
        run: npm ci
      - name: Install Chromium + system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Bring up the backing stack (db + redis + server)
        run: docker compose up -d --wait db redis server
      - name: Run E2E
        working-directory: e2e
        # xvfb gives the headed extension context a display; harmless for the others.
        run: xvfb-run -a npm test
        env:
          E2E_STACK: '1'
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Bot: .NET Telegram bot (does NOT compile core/); fully offline test suite, needs only the .NET SDK.
  bot:
    name: Bot (.NET build + tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # bot/nuget.config restores into a repo-local bot/packages/ folder; cache it per project files.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: bot/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('bot/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        working-directory: bot
        run: dotnet restore Stencil.TelegramBot.slnx
      - name: Build
        working-directory: bot
        run: dotnet build Stencil.TelegramBot.slnx --no-restore --configuration Release
      - name: Test
        working-directory: bot
        run: dotnet test Stencil.TelegramBot.slnx --no-build --configuration Release --verbosity normal

  # Guard hook: the PreToolUse AI-harness guard (.claude/hooks/guard.mjs) is security-relevant
  # code — keep its node:test suite green like any other subproject.
  guard-hook:
    name: Guard hook (JS tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.guard == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run guard tests
        run: node --test .claude/hooks/guard.test.mjs

  # Docker images: assert every shipped Dockerfile still builds (packaging guard, no push).
  # browser/cli/mcp/bot compile core/ so their build context is the REPO ROOT; server is ./server.
  docker-images:
    name: Docker images (build)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        # {image, dockerfile, context} per image whose inputs changed — see `changes`.
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.image }}
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:ci ${{ matrix.context }}
