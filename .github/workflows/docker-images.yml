name: Docker images

# On a version tag, builds every service image for linux/amd64 and linux/arm64 — each on a
# runner of its own arch, so no stage runs under emulation — and pushes it to Docker Hub as
# <account>/stencil-<app>, tagged with that app's own version (its manifest) and `latest`.
# Needs the repo variable DOCKERHUB_USERNAME (the account) and the secret DOCKERHUB_TOKEN (an
# access token with write access).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # The app folders that ship a Dockerfile; each builds from the repo root.
        app: [browser, cli, mcp, bot, server]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Read the app's version
        id: version
        run: echo "version=$(node tools/repo/versions.mjs --get ${{ matrix.app }})" >> "$GITHUB_OUTPUT"
      - name: Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USER }}/stencil-${{ matrix.app }}
          labels: |
            org.opencontainers.image.title=stencil-${{ matrix.app }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Pushed by digest only: the publish job names the two arches as one tagged image.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKERHUB_USER }}/stencil-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p digests
          digest='${{ steps.build.outputs.digest }}'
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.app }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [browser, cli, mcp, bot, server]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Read the app's version
        id: version
        run: echo "version=$(node tools/repo/versions.mjs --get ${{ matrix.app }})" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag both arches as one image
        working-directory: digests
        env:
          IMAGE: ${{ env.DOCKERHUB_USER }}/stencil-${{ matrix.app }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
